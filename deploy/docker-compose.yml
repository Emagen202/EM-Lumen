# Run from the project root:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  lumen:
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: em-lumen
    restart: always
    env_file: ../.env
    environment:
      DATA_DIR: /data
      PORT: "8080"
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"   # exposed only to the reverse proxy on the same host
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
