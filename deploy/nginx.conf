# nginx reverse proxy (put inside http { }). Replace host name and certificate paths.
server {
    listen 443 ssl http2;
    server_name lumen.example.com;
    ssl_certificate     /etc/ssl/lumen/fullchain.pem;
    ssl_certificate_key /etc/ssl/lumen/privkey.pem;
    client_max_body_size 1024m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;            # live updates (SSE)
        proxy_read_timeout 1h;
        proxy_request_buffering off;    # stream large uploads
    }
}
server { listen 80; server_name lumen.example.com; return 301 https://$host$request_uri; }
